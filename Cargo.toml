[package]
name = "lumrik_guides"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Ambient-aware multi-guide calling for 10x CRISPR feature-barcode matrices"
repository = "https://github.com/stela2502/lumrik"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
mapping_info = "0.1.0"
scdata = "0.2.3"
stela-int-to-str = "0.2.3"
statrs = "0.18"
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lumrik-guides"
path = "src/main.rs"
